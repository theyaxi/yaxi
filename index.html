<!DOCTYPE html>
<html>
<head>
    <title>YAXI COMMUNITY</title>

    <style>
        body{
            background:#0a0f1f;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }

        h1{
            font-size:70px;
            font-weight:bold;
            font-family: Arial, sans-serif;
            background: linear-gradient(90deg,#00c6ff,#0072ff);
            -webkit-background-clip: text;
            color: transparent;
            text-shadow:
                0 0 10px #00c6ff,
                0 0 20px #00c6ff,
                0 0 40px #0072ff,
                0 0 80px #0072ff;
            animation: glow 2s infinite alternate;
        }

        @keyframes glow{
            from{
                text-shadow:
                0 0 10px #00c6ff,
                0 0 20px #0072ff;
            }
            to{
                text-shadow:
                0 0 20px #00c6ff,
                0 0 40px #0072ff,
                0 0 80px #00c6ff;
            }
        }

    </style>

</head>

<body>

<h1>YAXI COMMUNITY</h1>

</body>
</html>
