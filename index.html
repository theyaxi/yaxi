<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yaxi Community</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    color:white;
    position:relative;
    overflow:hidden;

    /* JPG BACKGROUND */
    background:url("background.jpg") no-repeat center center fixed;
    background-size:cover;
}

/* Dark + Blue Overlay */
body::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:linear-gradient(
        rgba(0,0,0,0.6),
        rgba(0,40,80,0.7)
    );
    z-index:0;
}

/* Title */
h1{
    font-size:60px;
    letter-spacing:3px;
    color:#00c6ff;
    text-shadow:
        0 0 10px #00c6ff,
        0 0 25px #00c6ff,
        0 0 50px #0072ff;
    z-index:1;
}

/* Owner */
.owner{
    margin-top:15px;
    font-size:22px;
    color:#ccc;
    z-index:1;
}

/* Discord Button */
.discord-btn{
    margin-top:40px;
    padding:15px 40px;
    font-size:20px;
    background:linear-gradient(45deg,#0072ff,#00c6ff);
    color:white;
    text-decoration:none;
    border-radius:10px;
    transition:0.3s;
    box-shadow:0 0 20px #00bfff;
    z-index:1;
}

.discord-btn:hover{
    transform:scale(1.1);
    box-shadow:0 0 40px #00bfff;
}
</style>
</head>

<body>

<h1>Yaxi Community</h1>

<div class="owner">
Owner: <strong>! Evił 🌟</strong>
</div>

<a href="https://discord.gg/UyGjVeBNc" target="_blank" class="discord-btn">
Join Discord
</a>

</body>
</html>
