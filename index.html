<!DOCTYPE html>
<html>
<head>
<title>Yaxi Community</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  font-family:Arial, sans-serif;
  background:url("bg.jpg") no-repeat center center/cover;
  text-align:center;
  color:white;
}

/* Dark overlay */
body::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  z-index:-1;
}

/* Title */
h1{
  font-size:70px;
  letter-spacing:3px;
  color:#00c6ff;
  text-shadow:
    0 0 10px #00c6ff,
    0 0 20px #00c6ff,
    0 0 40px #0072ff;
  animation: glow 2s infinite alternate;
}

/* Owner */
.owner{
  margin-top:15px;
  font-size:22px;
  color:#ccc;
}

/* Discord Button */
.discord-btn{
  margin-top:40px;
  padding:15px 40px;
  font-size:20px;
  background:#0072ff;
  color:white;
  text-decoration:none;
  border-radius:10px;
  transition:0.3s;
  box-shadow:0 0 15px #0072ff;
}

.discord-btn:hover{
  background:#0055cc;
  transform:scale(1.1);
}

/* Glow Animation */
@keyframes glow{
  from{
    text-shadow:
      0 0 10px #00c6ff,
      0 0 20px #00c6ff,
      0 0 40px #0072ff;
  }
  to{
    text-shadow:
      0 0 20px #00c6ff,
      0 0 40px #00c6ff,
      0 0 60px #0072ff;
  }
}

</style>
</head>

<body>

<h1>Yaxi Community</h1>

<div class="owner">
Owner : <strong>Evil</strong>
</div>

<a href="https://discord.gg/UyGjVeBNc" target="_blank" class="discord-btn">
Join Discord
</a>

</body>
</html>
